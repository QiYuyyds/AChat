[project]
name = "agenthub-backend"
version = "0.1.0"
description = "AChat Python Backend - Multi-Agent Collaboration Workspace"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "AChat Team" }]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.2.0",
    "python-multipart>=0.0.17",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",

    # Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # AI SDKs
    "anthropic>=0.40.0",
    "openai>=1.57.0",

    # Utilities
    "nanoid>=2.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "pypdf>=5.1.0",  # read_attachment PDF text extraction (replaces TS pdf-parse)

    # Document parsing (DOCX/PPTX text extraction)
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pypdfium2>=4.30.0",  # PDF page rendering for OCR (DeepSeek-OCR / RapidOCR)
    "json-repair>=0.25.0",  # repair LLM JSON output in OCR results

    # Auth
    "bcrypt>=4.2.0",
    "PyJWT>=2.10.0",

    # MCP client (external MCP server support for Custom adapter)
    "mcp>=1.0.0",

    # Memory file-native (frontmatter parsing + Chinese BM25 tokenization)
    "python-frontmatter>=1.1.0",

    # Eval harness (suite YAML loading)
    "pyyaml>=6.0.0",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
