# Aeval PyPI publish — tag-triggered.
#
# NOTE: dormant in stage-1 (lives at aeval/.github/workflows/). Stage-2 moves
# it to the standalone repo root to activate. Requires a PYPI_TOKEN secret
# (project-scoped token for the `agent-eval` package). Publishing is gated on
# a maintainer-approved tag push (v*).

name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing (PyPI OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          cd packages/agent-eval
          python -m build
      - name: Publish to PyPI
        if: ${{ secrets.PYPI_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/agent-eval/dist/
          # Trusted publishing preferred; PYPI_TOKEN as fallback:
          password: ${{ secrets.PYPI_TOKEN }}
