name: http-agent-example
description: HTTP Agent 接入示例 — 对接自建 Agent 服务的最小套件
version: 1.0.0
metadata:
  purpose: http-agent-integration

tasks:
  - id: simple-qa
    description: 单轮问答 — Agent 回答包含预期关键词
    prompt: 请用一句话回答:HTTP 的默认端口号是多少?回答中请包含具体数字。
    max_trials: 3
    graders:
      - type: code
        name: code_based
        config:
          checks:
            - type: contains
              target: transcript
              value: "80"
            - type: regex
              target: transcript
              value: "\\d{2,5}"

  - id: file-creation
    description: workspace 文件创建 — Agent 在环境中写出指定文件
    prompt: >
      请在 workspace 中创建文件 hello.md,内容为一行:"Hello from Aeval!"。
      创建完成后简单说明你做了什么。
    max_trials: 3
    graders:
      - type: code
        name: code_based
        config:
          checks:
            - type: contains
              target: outcome
              value: "hello.md"
            - type: contains
              target: outcome
              value: "Hello from Aeval!"
