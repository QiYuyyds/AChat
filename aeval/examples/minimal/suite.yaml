name: aeval-minimal
description: 最小示例套件 — 内置 Mock Agent, 完全离线可跑
version: 1.0.0
metadata:
  purpose: offline quickstart

tasks:
  - id: echo-qa
    description: Mock Agent 回答中包含回应文本 — 验证基本执行与评分链路
    prompt: What files are in the workspace?
    max_trials: 3
    graders:
      - type: code
        name: code_based
        config:
          checks:
            - type: contains
              target: transcript
              value: "Mock response"

  - id: artifact-check
    description: Mock Agent 成功时产出 code_file 产物 — 验证产物类检查
    prompt: Please create a small Python module.
    max_trials: 3
    graders:
      - type: artifact
        name: artifact_check
        config:
          expected_type: "code_file"
