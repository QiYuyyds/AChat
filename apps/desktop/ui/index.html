<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AChat</title>
    <style>
      /* Match frontend AuthGate loading: warm greige paper + muted spinner */
      :root {
        --bg: oklch(0.985 0.006 75);
        --fg-muted: oklch(0.52 0.012 65);
        --ring: oklch(0.90 0.010 75);
        --primary: oklch(0.55 0.045 55);
      }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg-muted);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.875rem;
      }
      /* Lucide Loader2-like ring */
      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid var(--ring);
        border-top-color: var(--fg-muted);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .label {
        margin: 0;
        font-size: 0.8125rem;
        letter-spacing: 0.01em;
        color: var(--fg-muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="wrap" role="status" aria-live="polite" aria-label="正在启动">
        <div class="spinner" aria-hidden="true"></div>
        <p class="label">正在启动</p>
      </div>
    </main>
  </body>
</html>
